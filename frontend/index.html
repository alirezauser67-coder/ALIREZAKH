<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .ak-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0b0f1a;transition:opacity .5s ease,visibility .5s ease}.ak-splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}.ak-splash-rings{position:relative;width:72px;height:72px}.ak-splash-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}.ak-splash-ring:nth-child(1){border-top-color:#3b82f6;border-right-color:#3b82f6;animation:ak-orbit 1.2s linear infinite}.ak-splash-ring:nth-child(2){inset:7px;border-bottom-color:#0ea5e9;border-left-color:#0ea5e9;animation:ak-orbit-rev 1.6s linear infinite}.ak-splash-ring:nth-child(3){inset:14px;border-top-color:#60a5fa;animation:ak-orbit 2s linear infinite;opacity:.6}.ak-splash-core{position:absolute;inset:24px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#0ea5e9);animation:ak-pulse 1.4s ease-in-out infinite}.ak-splash-brand{font-size:20px;font-weight:700;letter-spacing:4px;background:linear-gradient(90deg,#3b82f6,#0ea5e9,#3b82f6);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ak-shimmer 2s linear infinite}.ak-splash-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35)}@keyframes ak-orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes ak-orbit-rev{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes ak-pulse{0%,100%{opacity:.4;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}@keyframes ak-shimmer{to{background-position:200% center}}@media(prefers-reduced-motion:reduce){.ak-splash-ring,.ak-splash-core,.ak-splash-brand{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="ak-splash" class="ak-splash">
      <div class="ak-splash-rings">
        <div class="ak-splash-ring"></div>
        <div class="ak-splash-ring"></div>
        <div class="ak-splash-ring"></div>
        <div class="ak-splash-core"></div>
      </div>
      <div class="ak-splash-brand">ALIREZAKH</div>
      <div class="ak-splash-sub">Control Panel</div>
    </div>
    <div id="message"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
