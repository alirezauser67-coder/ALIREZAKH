<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>ALIREZAKH</title>
    <style>
      .ak-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#020408;transition:opacity .5s ease,visibility .5s ease}.ak-splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}.ak-splash-rings{position:relative;width:72px;height:72px}.ak-splash-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}.ak-splash-ring:nth-child(1){border-top-color:#39ff14;border-right-color:#39ff14;animation:ak-orbit 1.2s linear infinite}.ak-splash-ring:nth-child(2){inset:7px;border-bottom-color:#00b4ff;border-left-color:#00b4ff;animation:ak-orbit-rev 1.6s linear infinite}.ak-splash-ring:nth-child(3){inset:14px;border-top-color:#ff1744;animation:ak-orbit 2s linear infinite;opacity:.6}.ak-splash-core{position:absolute;inset:24px;border-radius:50%;background:linear-gradient(135deg,#39ff14,#00b4ff);animation:ak-pulse 1.4s ease-in-out infinite}.ak-splash-brand{font-size:18px;font-weight:800;letter-spacing:5px;font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;background:linear-gradient(90deg,#39ff14,#00b4ff,#ff1744,#39ff14);background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ak-shimmer 2.5s linear infinite}.ak-splash-sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;color:rgba(57,255,20,.35)}@keyframes ak-orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes ak-orbit-rev{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes ak-pulse{0%,100%{opacity:.4;transform:scale(.92)}50%{opacity:1;transform:scale(1)}}@keyframes ak-shimmer{to{background-position:300% center}}@media(prefers-reduced-motion:reduce){.ak-splash-ring,.ak-splash-core,.ak-splash-brand{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="ak-splash" class="ak-splash">
      <div class="ak-splash-rings">
        <div class="ak-splash-ring"></div>
        <div class="ak-splash-ring"></div>
        <div class="ak-splash-ring"></div>
        <div class="ak-splash-core"></div>
      </div>
      <div class="ak-splash-brand">ALIREZAKH</div>
      <div class="ak-splash-sub">Control Panel</div>
    </div>
    <div id="message"></div>
    <div id="app"></div>
    <script type="module" src="/src/entries/login.tsx"></script>
  </body>
</html>
